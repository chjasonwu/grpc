services:
  grpc-server:
    build: .
    ports:
      - "50051:50051"
    restart: unless-stopped
    environment:
      - GRPC_VERBOSITY=info
      - TERM=xterm-256color
    volumes:
      - .:/app
      - ../protos:/protos
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "netstat -tlnp | grep :50051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
